<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Chalkboard Slate Backdrop Accent -->
  <rect width="32" height="32" rx="6" fill="#2F4A3E" />
  
  <!-- Faint Chalk Dust Particles on Slate -->
  <circle cx="8" cy="7" r="1" fill="#F2F0E6" opacity="0.3" />
  <circle cx="25" cy="24" r="1" fill="#F2F0E6" opacity="0.25" />
  <circle cx="26" cy="9" r="0.8" fill="#F6D860" opacity="0.4" />
  
  <!-- A Single Piece of White Chalk Resting at a Diagonal Angle -->
  <!-- Chalk Shadow on Slate -->
  <path d="M7 23 L23 7 L26 10 L10 26 Z" fill="#1C2F27" opacity="0.6" />
  
  <!-- Chalk Main Stick Body -->
  <path d="M8 21 L21 8 L24 11 L11 24 Z" fill="#F2F0E6" stroke="#D1CEC2" stroke-width="0.75" />
  
  <!-- Chalk Top Highlight / Cylindrical Edge -->
  <path d="M8 21 L21 8 L22.5 9.5 L9.5 22.5 Z" fill="#FFFFFF" />
  
  <!-- Chalk Writing Tip (Powdery, slightly rounded) -->
  <path d="M6.5 22.5 C6 23.5 7 25 8.5 24.5 L11 24 L8 21 Z" fill="#E5E2D5" />
  
  <!-- Chalk Bottom Flat Base -->
  <ellipse cx="22.5" cy="9.5" rx="2" ry="1.4" transform="rotate(-45 22.5 9.5)" fill="#DCD8CA" />
  
  <!-- Chalk Dust Smudge near Tip -->
  <path d="M5 25 Q7 26 10 25.5" stroke="#F2F0E6" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
</svg>
