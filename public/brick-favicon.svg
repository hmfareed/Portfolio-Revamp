<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 3D Red Plastic Toy Brick Favicon -->
  <defs>
    <linearGradient id="brickBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E54B3C" />
      <stop offset="100%" stop-color="#B7281D" />
    </linearGradient>
    <linearGradient id="studGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B5C" />
      <stop offset="100%" stop-color="#C63124" />
    </linearGradient>
  </defs>

  <!-- Brick Main Body Plate -->
  <rect x="2" y="5" width="28" height="24" rx="4" fill="url(#brickBody)" stroke="#8A180F" stroke-width="1.5" />
  <!-- Inner Highlight -->
  <rect x="3.5" y="6.5" width="25" height="2" rx="1" fill="#FFA59E" opacity="0.6" />
  <!-- Bottom Shadow Edge -->
  <rect x="3.5" y="26.5" width="25" height="1.5" rx="0.5" fill="#6A1009" opacity="0.6" />

  <!-- 4 Round Cylindrical Studs (2x2) -->
  <!-- Top Left Stud -->
  <circle cx="9" cy="11.5" r="4" fill="url(#studGrad)" stroke="#8A180F" stroke-width="1.2" />
  <circle cx="9" cy="10.8" r="3.2" fill="none" stroke="#FFD2CE" stroke-width="0.8" opacity="0.8" />

  <!-- Top Right Stud -->
  <circle cx="23" cy="11.5" r="4" fill="url(#studGrad)" stroke="#8A180F" stroke-width="1.2" />
  <circle cx="23" cy="10.8" r="3.2" fill="none" stroke="#FFD2CE" stroke-width="0.8" opacity="0.8" />

  <!-- Bottom Left Stud -->
  <circle cx="9" cy="22" r="4" fill="url(#studGrad)" stroke="#8A180F" stroke-width="1.2" />
  <circle cx="9" cy="21.3" r="3.2" fill="none" stroke="#FFD2CE" stroke-width="0.8" opacity="0.8" />

  <!-- Bottom Right Stud -->
  <circle cx="23" cy="22" r="4" fill="url(#studGrad)" stroke="#8A180F" stroke-width="1.2" />
  <circle cx="23" cy="21.3" r="3.2" fill="none" stroke="#FFD2CE" stroke-width="0.8" opacity="0.8" />
</svg>
